---
- name: Test Azure connection
  hosts: localhost
  connection: local
  gather_facts: false

  vars: 
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  tasks:
    - name: Read Azure resource groups
      azure.azcollection.azure_rm_resourcegroup_info:
        auth_source: cli
      register: azure_test

    - name: Confirm connection
      ansible.builtin.debug:
        msg: "Successfully connected to Azure. Found {{ azure_test.resourcegroups | length }} resource groups."